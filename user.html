<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❄️ Phốt Zone ❄️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  
  body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }
  
  #snow-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  
  .snowflake {
    position: absolute;
    top: -10px;
    color: #fff;
    font-size: 1em;
    user-select: none;
    pointer-events: none;
    animation: fall linear infinite;
    opacity: 0.9;
    text-shadow: 0 0 5px rgba(255,255,255,0.8);
  }
  
  @keyframes fall {
    0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
    100% { transform: translateY(110vh) translateX(100px) rotate(360deg); }
  }
  
  .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 2; }
  
  /* ===== TOPBAR VỚI NÚT TIKTOK ===== */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 25px;
    background: rgba(255,255,255,0.08);
    border-radius: 15px;
    margin-bottom: 25px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .topbar .logo {
    font-size: 1.5em;
    font-weight: bold;
    background: linear-gradient(90deg, #74ebd5, #ACB6E5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  
  .tiktok-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    text-decoration: none;
    padding: 8px 16px;
    border: 2px solid #74ebd5;
    border-radius: 10px;
    font-weight: bold;
    transition: all 0.3s;
    font-size: 0.95em;
    background: transparent;
  }
  
  .tiktok-btn:hover {
    background: #74ebd5;
    color: #0f2027;
    box-shadow: 0 0 20px rgba(116, 235, 213, 0.6);
    transform: translateY(-2px);
  }
  
  .tiktok-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }
  
  header { text-align: center; padding: 20px 0 30px; }
  
  header p {
    color: #a8c5d1;
    font-size: 1.15em;
    font-style: italic;
  }
  
  .card {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  
  .card h2 {
    color: #74ebd5;
    margin-bottom: 20px;
    font-size: 1.4em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .post-item {
    background: rgba(255, 255, 255, 0.06);
    border-left: 4px solid #74ebd5;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    animation: slideIn 0.5s ease;
    transition: transform 0.3s;
  }
  
  .post-item:hover {
    transform: translateX(5px);
    box-shadow: 0 5px 25px rgba(116,235,213,0.2);
  }
  
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  
  .post-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .post-author { font-weight: bold; color: #74ebd5; }
  .post-time { color: #8ba3ae; font-size: 0.9em; }
  
  .post-category {
    background: linear-gradient(135deg, #74ebd5, #4fc3f7);
    color: #0f2027;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85em;
    font-weight: bold;
    margin-left: 10px;
  }
  
  .post-content {
    line-height: 1.7;
    color: #dde6eb;
    margin-bottom: 15px;
    white-space: pre-wrap;
    font-size: 1.05em;
  }
  
  .post-images {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  
  .post-images img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
  }
  
  .post-images img:hover {
    transform: scale(1.05);
    border-color: #74ebd5;
    box-shadow: 0 0 20px rgba(116,235,213,0.5);
  }
  
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #8ba3ae;
    font-style: italic;
    font-size: 1.1em;
  }
  
  .empty-state .icon { font-size: 3em; display: block; margin-bottom: 15px; }
  
  .loading {
    text-align: center;
    padding: 40px;
    color: #74ebd5;
    font-size: 1.1em;
  }
  
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.95);
    z-index: 999;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }
  
  .modal.show { display: flex; }
  .modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(116,235,213,0.5);
  }
  
  /* ===== FOOTER VỚI NÚT TIKTOK ===== */
  .footer {
    text-align: center;
    margin-top: 40px;
    padding: 30px 20px;
    position: relative;
    z-index: 2;
  }
  
  .footer p {
    color: #8ba3ae;
    margin-bottom: 15px;
    font-size: 0.95em;
  }
  
  .tiktok-big {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 30px;
    background: linear-gradient(135deg, #25F4EE, #FE2C55);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    font-size: 1.05em;
    transition: all 0.3s;
    box-shadow: 0 5px 20px rgba(254, 44, 85, 0.4);
  }
  
  .tiktok-big:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 30px rgba(254, 44, 85, 0.6);
  }
  
  .tiktok-big svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }
  
  @media (max-width: 600px) {
    .card { padding: 20px; }
    header p { font-size: 1em; }
    .topbar { justify-content: center; }
    .topbar .logo { font-size: 1.2em; }
  }
</style>
</head>
<body>

<div id="snow-container"></div>

<div class="container">
  <!-- TOPBAR với nút TikTok bên phải -->
  <div class="topbar">
    <div class="logo">❄️ PHỐT ZONE ❄️</div>
    <a href="https://www.tiktok.com/@chagarena" target="_blank" class="tiktok-btn">
      <svg viewBox="0 0 24 24">
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
      </svg>
      TikTok
    </a>
  </div>

  <header>
    <p>✨ Nơi mọi câu chuyện được phơi bày ✨</p>
  </header>

  <div class="card">
    <h2>📰 Danh sách bài phốt</h2>
    <div id="postList">
      <div class="loading">⏳ Đang tải dữ liệu...</div>
    </div>
  </div>
</div>

<!-- FOOTER với nút TikTok lớn -->
<footer class="footer">
  <p>Theo dõi mình trên TikTok để xem thêm nhiều phốt hay:</p>
  <a href="https://www.tiktok.com/@chagarena" target="_blank" class="tiktok-big">
    <svg viewBox="0 0 24 24">
      <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
    </svg>
    Theo dõi @chagarena
  </a>
</footer>

<div class="modal" id="imageModal" onclick="closeModal()">
  <img id="modalImg" src="">
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDZ_QDRqrt7dGEnYdWac4qw8mtaQTAo-lo",
    authDomain: "phot-zone.firebaseapp.com",
    projectId: "phot-zone",
    storageBucket: "phot-zone.firebasestorage.app",
    messagingSenderId: "563552492616",
    appId: "1:563552492616:web:602dad5451719e81cecc7d",
    measurementId: "G-WCRJ84GH3D"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ===== TUYẾT RƠI =====
  function createSnow() {
    const container = document.getElementById('snow-container');
    const snowChars = ['❄', '❅', '❆', '•', '*', '❄'];
    for (let i = 0; i < 60; i++) {
      const snow = document.createElement('div');
      snow.className = 'snowflake';
      snow.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];
      snow.style.left = Math.random() * 100 + '%';
      snow.style.fontSize = (Math.random() * 15 + 8) + 'px';
      snow.style.animationDuration = (Math.random() * 8 + 6) + 's';
      snow.style.animationDelay = (Math.random() * 10) + 's';
      snow.style.opacity = (Math.random() * 0.5 + 0.4);
      container.appendChild(snow);
    }
  }
  createSnow();

  // ===== LOAD POSTS TỪ FIREBASE =====
  async function loadPosts() {
    const postList = document.getElementById('postList');
    try {
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      const snapshot = await getDocs(q);
      const posts = snapshot.docs.map(d => d.data());

      if (posts.length === 0) {
        postList.innerHTML = '<div class="empty-state"><span class="icon">❄️</span>Chưa có bài phốt nào được đăng.</div>';
        return;
      }

      postList.innerHTML = posts.map(post => `
        <div class="post-item">
          <div class="post-header">
            <div>
              <span class="post-author">👤 ${escapeHtml(post.author)}</span>
              <span class="post-category">${escapeHtml(post.category)}</span>
            </div>
            <span class="post-time">${post.time || ''}</span>
          </div>
          ${post.content ? `<div class="post-content">${escapeHtml(post.content)}</div>` : ''}
          ${post.images && post.images.length > 0 ? `
            <div class="post-images">
              ${post.images.map(img => `<img src="${img}" onclick="openModal('${img}')">`).join('')}
            </div>` : ''}
        </div>
      `).join('');
    } catch (e) {
      console.error(e);
      postList.innerHTML = '<div class="empty-state">❌ Lỗi tải dữ liệu: ' + e.message + '</div>';
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  function openModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('imageModal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('imageModal').classList.remove('show');
  }

  window.openModal = openModal;
  window.closeModal = closeModal;

  // Load lần đầu + auto refresh mỗi 10 giây
  loadPosts();
  setInterval(loadPosts, 10000);
</script>

</body>
</html>
